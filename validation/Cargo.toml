[package]
name = "pokertrainer-validation"
version = "0.1.0"
edition = "2021"
description = "JSON-bridge CLI: read a postflop spot, run postflop-solver, emit GTO root strategy."

[[bin]]
name = "pt-solver"
path = "src/main.rs"

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver.git", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
