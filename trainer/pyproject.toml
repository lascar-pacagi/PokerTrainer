[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pokertrainer-trainer"
version = "0.1.0"
description = "DouZero-style DMC training loop for HU NLHE"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["dmc*", "evaluate*", "export*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
