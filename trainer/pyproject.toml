[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pokertrainer-trainer"
version = "0.1.0"
description = "DouZero-style DMC training loop for HU NLHE"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

# Must list every package that ships in this tree: evaluate/policies.py imports
# cfr.*, and the search trainers (rebel_py, pluribus) are first-class too. Omit
# one and `pip install -e .` leaves imports broken outside a PYTHONPATH checkout.
[tool.setuptools.packages.find]
include = ["cfr*", "dmc*", "evaluate*", "export*", "rebel_py*", "pluribus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
